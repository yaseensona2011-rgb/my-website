<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تنبيه أمني</title>

<style>
body {
  margin: 0;
  background: #050505;
  color: #00ff66;
  font-family: monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
}

.box {
  width: 80%;
  max-width: 450px;
  padding: 30px;
  border: 2px solid #00ff66;
  border-radius: 15px;
  box-shadow: 0 0 25px #00ff66;
}

h1 {
  color: red;
  font-size: 28px;
}

p {
  font-size: 18px;
}
</style>
</head>

<body>

<div class="box">
  <h1>⚠️ ياسين يخترق جهازك!</h1>

  <p>جارٍ اختراق الجهاز...</p>

  <p id="text">████████ 0%</p>
</div>

<script>
let n = 0;

const timer = setInterval(() => {

  n += 25;

  document.getElementById("text").textContent =
    "████████ " + n + "%";

  if (n >= 100) {

    clearInterval(timer);

    setTimeout(() => {

      document.querySelector("h1").textContent =
        "😂 بهزر معاك!";

      document.querySelector("p").textContent =
        "جهازك بخير ❤️";

      document.getElementById("text").textContent =
        "دي كانت مجرد مزحة 😎";

    }, 300);
  }

}, 150);
</script>

</body>
</html>
